<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Sherlock Home Roadmap</title>
  <desc id="desc">Separate backend and frontend roadmap lanes for Sherlock Home. Backend phases 1, 2, 4, 5, and 6 are done; phase 3 remains in progress for CSV and OFX ingestion; phase 7 local retrieval is planned. Frontend phase F0 product direction is done; F1 web shell and authenticated navigation is next; later frontend phases are planned toward the Holmes-Hat release.</desc>

  <defs>
    <style>
      .bg { fill: #f6f7f4; }
      .title { font: 700 44px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #16302b; }
      .subtitle { font: 400 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #50605b; }
      .lane { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #16302b; }
      .phase { font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17312c; }
      .small { font: 400 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #45554f; }
      .status { font: 700 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .8px; }
      .footer { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5c6a66; }
      .done { fill: #dff3e9; stroke: #78b89d; stroke-width: 2; }
      .progress { fill: #fff1d9; stroke: #d8a84a; stroke-width: 2; }
      .planned { fill: #eaf0f8; stroke: #8ea9c5; stroke-width: 2; }
      .next { fill: #e3f2f0; stroke: #3e9c91; stroke-width: 3; }
      .release { fill: #16302b; stroke: #16302b; stroke-width: 2; }
      .lane-line { stroke: #c7d2ce; stroke-width: 4; }
      .connector { stroke: #8aa39b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .divider { stroke: #d5ddda; stroke-width: 2; stroke-dasharray: 7 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8aa39b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1120" rx="28"/>

  <text class="title" x="80" y="82">Sherlock Home Roadmap</text>
  <text class="subtitle" x="80" y="118">Backend and frontend evolve on separate tracks. Holmes-Hat ships when the backend foundation and minimum household web UI meet.</text>

  <!-- Legend -->
  <g transform="translate(1080 62)">
    <rect class="done" x="0" y="0" width="110" height="34" rx="17"/>
    <text class="status" x="55" y="22" text-anchor="middle" fill="#2e6e57">DONE</text>
    <rect class="progress" x="124" y="0" width="135" height="34" rx="17"/>
    <text class="status" x="191.5" y="22" text-anchor="middle" fill="#8b671e">IN PROGRESS</text>
    <rect class="planned" x="273" y="0" width="118" height="34" rx="17"/>
    <text class="status" x="332" y="22" text-anchor="middle" fill="#4f6d8a">PLANNED</text>
  </g>

  <!-- BACKEND LANE -->
  <text class="lane" x="80" y="190">Backend Architecture</text>
  <text class="small" x="80" y="218">Security, persistence, financial data, deterministic tools, agentic execution and local retrieval.</text>
  <line class="lane-line" x1="100" y1="276" x2="1500" y2="276"/>

  <!-- Backend cards -->
  <g transform="translate(70 245)">
    <rect class="done" x="0" y="0" width="190" height="132" rx="18"/>
    <text class="phase" x="18" y="34">Phase 1</text>
    <text class="small" x="18" y="62">Local Runtime</text>
    <text class="small" x="18" y="84">Ollama + FastAPI</text>
    <text class="status" x="18" y="112" fill="#2e6e57">DONE</text>

    <rect class="done" x="210" y="0" width="190" height="132" rx="18"/>
    <text class="phase" x="228" y="34">Phase 2</text>
    <text class="small" x="228" y="62">Security</text>
    <text class="small" x="228" y="84">Fail-closed policy</text>
    <text class="status" x="228" y="112" fill="#2e6e57">DONE</text>

    <rect class="progress" x="420" y="0" width="220" height="132" rx="18"/>
    <text class="phase" x="438" y="34">Phase 3</text>
    <text class="small" x="438" y="62">Financial Data</text>
    <text class="small" x="438" y="84">CSV + OFX remain</text>
    <text class="status" x="438" y="112" fill="#8b671e">IN PROGRESS</text>

    <rect class="done" x="660" y="0" width="210" height="132" rx="18"/>
    <text class="phase" x="678" y="34">Phase 4</text>
    <text class="small" x="678" y="62">Authenticated API</text>
    <text class="small" x="678" y="84">Sessions + CSRF</text>
    <text class="status" x="678" y="112" fill="#2e6e57">DONE</text>

    <rect class="done" x="890" y="0" width="190" height="132" rx="18"/>
    <text class="phase" x="908" y="34">Phase 5</text>
    <text class="small" x="908" y="62">Financial Tools</text>
    <text class="small" x="908" y="84">Deterministic analysis</text>
    <text class="status" x="908" y="112" fill="#2e6e57">DONE</text>

    <rect class="done" x="1100" y="0" width="200" height="132" rx="18"/>
    <text class="phase" x="1118" y="34">Phase 6</text>
    <text class="small" x="1118" y="62">Agentic Layer</text>
    <text class="small" x="1118" y="84">Planner + tools</text>
    <text class="status" x="1118" y="112" fill="#2e6e57">DONE</text>

    <rect class="planned" x="1320" y="0" width="190" height="132" rx="18"/>
    <text class="phase" x="1338" y="34">Phase 7</text>
    <text class="small" x="1338" y="62">Local Retrieval</text>
    <text class="small" x="1338" y="84">Embeddings + RAG</text>
    <text class="status" x="1338" y="112" fill="#4f6d8a">PLANNED</text>
  </g>

  <text class="small" x="80" y="412">Current backend frontier: Phase 3 format adapters can continue independently; core financial analysis and agentic execution are already validated.</text>

  <line class="divider" x1="80" y1="462" x2="1520" y2="462"/>

  <!-- FRONTEND LANE -->
  <text class="lane" x="80" y="520">Frontend Architecture</text>
  <text class="small" x="80" y="548">Household-facing web UI, navigation, charts, goals, shared finances, accessibility and Sherlock chat.</text>

  <!-- Frontend flow -->
  <g transform="translate(70 590)">
    <rect class="done" x="0" y="0" width="210" height="150" rx="18"/>
    <text class="phase" x="18" y="34">F0</text>
    <text class="small" x="18" y="62">Product Direction</text>
    <text class="small" x="18" y="84">Mockups + architecture</text>
    <text class="small" x="18" y="104">Light/dark + accessibility</text>
    <text class="status" x="18" y="132" fill="#2e6e57">DONE</text>

    <path class="connector" d="M210 75 H250"/>

    <rect class="next" x="260" y="0" width="230" height="150" rx="18"/>
    <text class="phase" x="278" y="34">F1</text>
    <text class="small" x="278" y="62">Web Shell + Auth</text>
    <text class="small" x="278" y="84">Login + navigation</text>
    <text class="small" x="278" y="104">Preferences + themes</text>
    <text class="status" x="278" y="132" fill="#267a70">NEXT</text>

    <path class="connector" d="M490 75 H530"/>

    <rect class="planned" x="540" y="0" width="210" height="150" rx="18"/>
    <text class="phase" x="558" y="34">F2</text>
    <text class="small" x="558" y="62">Dashboard + Views</text>
    <text class="small" x="558" y="84">Charts + transactions</text>
    <text class="small" x="558" y="104">Alerts + duplicates</text>
    <text class="status" x="558" y="132" fill="#4f6d8a">PLANNED</text>

    <path class="connector" d="M750 75 H790"/>

    <rect class="planned" x="800" y="0" width="220" height="150" rx="18"/>
    <text class="phase" x="818" y="34">F3</text>
    <text class="small" x="818" y="62">Goals + Household</text>
    <text class="small" x="818" y="84">Metas financeiras</text>
    <text class="small" x="818" y="104">Metas conjuntas</text>
    <text class="status" x="818" y="132" fill="#4f6d8a">PLANNED</text>

    <path class="connector" d="M1020 75 H1060"/>

    <rect class="planned" x="1070" y="0" width="190" height="150" rx="18"/>
    <text class="phase" x="1088" y="34">F4</text>
    <text class="small" x="1088" y="62">Sherlock Chat</text>
    <text class="small" x="1088" y="84">Evidence panel</text>
    <text class="small" x="1088" y="104">Local runtime status</text>
    <text class="status" x="1088" y="132" fill="#4f6d8a">PLANNED</text>

    <path class="connector" d="M1260 75 H1300"/>

    <rect class="planned" x="1310" y="0" width="200" height="150" rx="18"/>
    <text class="phase" x="1328" y="34">F5</text>
    <text class="small" x="1328" y="62">Accessibility</text>
    <text class="small" x="1328" y="84">Color-safe palettes</text>
    <text class="small" x="1328" y="104">Keyboard + summaries</text>
    <text class="status" x="1328" y="132" fill="#4f6d8a">PLANNED</text>
  </g>

  <!-- Holmes Hat target -->
  <g transform="translate(260 805)">
    <rect class="release" x="0" y="0" width="1080" height="152" rx="24"/>
    <text x="36" y="48" style='font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#ffffff;'>v1.0.0 — Holmes-Hat</text>
    <text x="36" y="82" style='font:400 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#d9ebe5;'>Minimum household web experience: authenticated login, dashboard, transactions, categories, alerts, duplicate-charge review, Sherlock chat, theme controls and basic accessible chart palettes.</text>
    <text x="36" y="116" style='font:700 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#9fd8c8;'>Frontend milestone F6 — release gate</text>
  </g>

  <text class="footer" x="80" y="1020">Backend roadmap: docs/ROADMAP.md</text>
  <text class="footer" x="80" y="1048">Frontend roadmap: docs/frontend/ROADMAP.md</text>
  <text class="footer" x="80" y="1076">Status reflects completed backend financial tools and agentic capabilities, plus the newly separated frontend planning track.</text>
</svg>
