[project]
name = "sherlock-home"
version = "0.1.0"
description = "Local-first AI agent for personal finance analysis"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic-settings"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
